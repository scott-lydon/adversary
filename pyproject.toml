[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "adversary"
version = "0.1.0"
description = "Multi-agent adversarial AI security platform"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Scott Lydon"}]

dependencies = [
  "litellm>=1.50.0",
  "langgraph>=0.2.50",
  "langchain-core>=0.3.0",
  "httpx>=0.27.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0",
  "langfuse>=2.50.0",
  "opentelemetry-api>=1.27.0",
  "opentelemetry-sdk>=1.27.0",
  "structlog>=24.0.0",
  "sqlalchemy>=2.0.30",
  "asyncpg>=0.29.0",
  "alembic>=1.13.0",
  "pydantic>=2.9.0",
  "pydantic-settings>=2.5.0",
  "typer>=0.12.0",
  "rich>=13.7.0",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.6.0",
  "mypy>=1.11.0",
]

[project.scripts]
adversary = "adversary.cli:app"

[tool.ruff]
line-length = 100
target-version = "py312"
