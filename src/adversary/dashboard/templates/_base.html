<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Adversary {% block title %}{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  {% block head_extra %}{% endblock %}
  <style>
    :root {
      --bg: #0a0e1a;
      --bg2: #121826;
      --panel: #1a2236;
      --panel2: #232d44;
      --accent: #6366f1;
      --accent2: #818cf8;
      --good: #34d399;
      --warn: #fbbf24;
      --bad: #f87171;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --border: #2d3a55;
    }
    html, body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; scroll-behavior: smooth; }
    .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; }
    .panel-hover { transition: all 0.2s; }
    .panel-hover:hover { border-color: var(--accent2); transform: translateY(-2px); }
    .accent-text { color: var(--accent2); }
    .good { color: var(--good); }
    .warn { color: var(--warn); }
    .bad { color: var(--bad); }
    .muted { color: var(--muted); }
    .border-good { border-color: var(--good); }
    .border-bad { border-color: var(--bad); }
    .border-warn { border-color: var(--warn); }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid var(--border); padding: 10px 14px; text-align: left; }
    th { background: var(--panel2); font-weight: 600; }
    tr:nth-child(even) td { background: rgba(35, 45, 68, 0.4); }
    code { background: var(--panel2); padding: 2px 8px; border-radius: 4px; font-family: "JetBrains Mono", Menlo, Monaco, Consolas, monospace; font-size: 0.9em; }
    pre { background: var(--panel2); padding: 16px; border-radius: 8px; overflow-x: auto; border: 1px solid var(--border); }
    pre code { background: transparent; padding: 0; }
    .nav-link { color: var(--muted); transition: color 0.15s; }
    .nav-link:hover { color: var(--accent2); }
    .nav-link.active { color: var(--accent2); }
    .section-anchor { scroll-margin-top: 80px; }
    .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 0.75rem; font-weight: 600; }
    .badge-good { background: rgba(52, 211, 153, 0.15); color: var(--good); border: 1px solid rgba(52, 211, 153, 0.3); }
    .badge-warn { background: rgba(251, 191, 36, 0.15); color: var(--warn); border: 1px solid rgba(251, 191, 36, 0.3); }
    .badge-bad { background: rgba(248, 113, 113, 0.15); color: var(--bad); border: 1px solid rgba(248, 113, 113, 0.3); }
    .badge-info { background: rgba(99, 102, 241, 0.15); color: var(--accent2); border: 1px solid rgba(99, 102, 241, 0.3); }
    .badge-muted { background: rgba(148, 163, 184, 0.12); color: var(--muted); border: 1px solid rgba(148, 163, 184, 0.25); }
    .gradient-text { background: linear-gradient(135deg, #818cf8 0%, #34d399 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .grid-pattern { background-image: linear-gradient(rgba(99, 102, 241, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(99, 102, 241, 0.05) 1px, transparent 1px); background-size: 24px 24px; }
    .agent-badge { display: inline-block; padding: 2px 8px; border-radius: 6px; font-size: 0.7rem; font-weight: 600; font-family: "JetBrains Mono", Menlo, Monaco, Consolas, monospace; }
    .agent-orchestrator { background: rgba(167, 139, 250, 0.15); color: #a78bfa; border: 1px solid rgba(167, 139, 250, 0.3); }
    .agent-red_team { background: rgba(248, 113, 113, 0.15); color: var(--bad); border: 1px solid rgba(248, 113, 113, 0.3); }
    .agent-judge { background: rgba(192, 132, 252, 0.15); color: #c084fc; border: 1px solid rgba(192, 132, 252, 0.3); }
    .agent-documentation { background: rgba(52, 211, 153, 0.15); color: var(--good); border: 1px solid rgba(52, 211, 153, 0.3); }
    .agent-target_adapter { background: rgba(96, 165, 250, 0.15); color: #60a5fa; border: 1px solid rgba(96, 165, 250, 0.3); }
    a { color: var(--accent2); }
    a:hover { color: var(--accent); }
    .role-bubble { padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--panel2); }
    .role-user { border-color: rgba(99, 102, 241, 0.4); }
    .role-assistant { border-color: rgba(52, 211, 153, 0.4); }
    .role-system { border-color: rgba(251, 191, 36, 0.4); }
  </style>
</head>
<body class="min-h-screen">

<!-- Sticky nav -->
<nav class="sticky top-0 z-50 backdrop-blur-md" style="background: rgba(10, 14, 26, 0.85); border-bottom: 1px solid var(--border);">
  <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
    <a href="/" class="flex items-center gap-3 no-underline">
      <div class="w-9 h-9 rounded-lg flex items-center justify-center" style="background: linear-gradient(135deg, #6366f1 0%, #34d399 100%);">
        <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-label="fencer" style="height: 24px; width: 24px;">
          <ellipse cx="20" cy="18" rx="6" ry="5.5" fill="#0a0e1a"/>
          <line x1="14.5" y1="18" x2="25.5" y2="18" stroke="#e2e8f0" stroke-width="1.4"/>
          <path d="M20 23 Q19 31 24 38" stroke="#0a0e1a" stroke-width="4" stroke-linecap="round" fill="none"/>
          <line x1="24" y1="38" x2="14" y2="56" stroke="#0a0e1a" stroke-width="3.5" stroke-linecap="round"/>
          <line x1="24" y1="38" x2="44" y2="54" stroke="#0a0e1a" stroke-width="3.5" stroke-linecap="round"/>
          <line x1="24" y1="27" x2="60" y2="22" stroke="#0a0e1a" stroke-width="2.5" stroke-linecap="round"/>
          <line x1="20" y1="27" x2="26" y2="26" stroke="#0a0e1a" stroke-width="3" stroke-linecap="round"/>
          <circle cx="27" cy="26" r="2.2" fill="#0a0e1a"/>
          <path d="M20 25 Q12 22 10 14" stroke="#0a0e1a" stroke-width="2.6" stroke-linecap="round" fill="none"/>
        </svg>
      </div>
      <span class="font-bold text-lg" style="color: var(--text);">Adversary</span>
      <span class="badge badge-good">live</span>
    </a>
    <div class="hidden md:flex gap-6 text-sm items-center">
      <a href="/" class="nav-link">Summary</a>
      <a href="/targets" class="nav-link">Targets</a>
      <a href="/findings" class="nav-link">Findings</a>
      <a href="/coverage" class="nav-link">Coverage</a>
      <a href="/glossary" class="nav-link">Glossary</a>
      <a href="/audit" class="nav-link">Audit</a>
      <a href="/campaigns" class="nav-link">Campaigns</a>
      <a href="/docs" target="_blank" class="nav-link">API</a>
    </div>
  </div>
</nav>

<main class="max-w-7xl mx-auto px-6 py-10">
  {% block content %}{% endblock %}
</main>

<footer class="border-t mt-16 py-8" style="border-color: var(--border); background: var(--bg2);">
  <div class="max-w-7xl mx-auto px-6 text-sm muted flex items-center justify-between">
    <div>
      Adversary platform &middot;
      audit head <code>{{ (footer_audit_head or '0000000000000000') | string | truncate(16, true, '') }}</code>
    </div>
    <a href="/audit" class="nav-link">view chain</a>
  </div>
</footer>

</body>
</html>
