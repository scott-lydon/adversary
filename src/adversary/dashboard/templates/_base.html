<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Adversary {% block title %}{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: #0a0e1a; color: #e2e8f0; font-family: ui-sans-serif, system-ui, sans-serif; }
    .panel { background: #1a2236; border-radius: 0.75rem; padding: 1rem; }
    .badge { padding: 0.15rem 0.5rem; border-radius: 0.375rem; font-size: 0.75rem; font-weight: 600; }
    a { color: #6366f1; }
  </style>
</head>
<body class="min-h-screen">
  <header class="border-b border-slate-700 p-4 flex gap-6">
    <span class="font-bold text-white">Adversary</span>
    <a href="/" class="hover:text-white">Summary</a>
    <a href="/findings" class="hover:text-white">Findings</a>
    <a href="/coverage" class="hover:text-white">Coverage</a>
    <a href="/audit" class="hover:text-white">Audit</a>
  </header>
  <main class="p-6 space-y-6">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
